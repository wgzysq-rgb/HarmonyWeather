name: Release

# 两种发版方式：
#   1. Actions 页面 → Run workflow → 填版本号（如 1.1.0），全自动编译 + 打 tag + 发 Release
#   2. 本地 git push 一个 v* tag（需要能访问 github.com）
#
# 流水线里**现场编译**，不再依赖仓库里的 dist/*.hap 快照。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0，不要带 v）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: harmonyos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 编译并发布
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 华为 Command Line Tools，内嵌 HarmonyOS 26.0.0 SDK
      HARMONY_CLI_VERSION: 26.0.0.821
      HARMONY_CLI_ARCHIVE: commandline-tools-linux-x64-26.0.0.821.zip
      HARMONY_CLI_SHA256: 58da7359019e9360a8bb82da0cd1d3b3b26fedc338379f257849f2162e3ac1fc
      HARMONY_CLI_URL: https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/d1/v3/PCx_dpJhQG63WXNUPT30vg/commandline-tools-linux-x64-26.0.0.821.zip?HW-CC-KV=V1&HW-CC-Date=20260911T194309Z&HW-CC-Expire=315360000&HW-CC-Sign=3DB31575DB2B7D734B702811DD4737C04CB4CEE100F2FA0B421E49F258DF7850
      HARMONY_CLI_DIR: ${{ github.workspace }}/.harmony-cli
      HARMONY_CLI_HOME: ${{ github.workspace }}/.harmony-cli/command-line-tools

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${tag}"

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 静态不变量检查
        run: node tools/check-invariants.mjs

      - name: 准备 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 HarmonyOS 工具链
        id: cache-harmony-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.HARMONY_CLI_DIR }}
          key: harmonyos-cli-linux-x64-${{ env.HARMONY_CLI_VERSION }}-${{ env.HARMONY_CLI_SHA256 }}

      - name: 下载 HarmonyOS 工具链
        if: steps.cache-harmony-cli.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/${HARMONY_CLI_ARCHIVE}"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            "${HARMONY_CLI_URL}" --output "${archive_path}"
          echo "${HARMONY_CLI_SHA256}  ${archive_path}" | sha256sum --check --strict
          rm -rf "${HARMONY_CLI_DIR}"
          mkdir -p "${HARMONY_CLI_DIR}"
          unzip -q "${archive_path}" -d "${HARMONY_CLI_DIR}"
          rm -f "${archive_path}"

      - name: 配置构建环境
        shell: bash
        run: |
          set -euo pipefail
          test -d "${HARMONY_CLI_HOME}/bin"
          chmod -R u+x "${HARMONY_CLI_HOME}/bin"
          echo "${HARMONY_CLI_HOME}/bin" >> "${GITHUB_PATH}"
          node_home="$(dirname "$(dirname "$(command -v node)")")"
          {
            echo "DEVECO_NODE_HOME=${node_home}"
            echo "DEVECO_SDK_HOME=${HARMONY_CLI_HOME}"
            echo "OHPM_HOME=${HARMONY_CLI_HOME}/ohpm"
            echo "HOS_SDK_HOME=${HARMONY_CLI_HOME}/sdk"
          } >> "${GITHUB_ENV}"
          {
            echo "hwsdk.dir=${HARMONY_CLI_HOME}/sdk"
            echo "sdk.dir=${HARMONY_CLI_HOME}/sdk"
          } > local.properties

      - name: 安装依赖
        shell: bash
        run: ohpm install

      - name: 编译未签名 HAP
        shell: bash
        run: hvigorw assembleHap --mode module -p product=default --no-daemon

      - name: 收集产物
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          count=0
          for f in entry/build/default/outputs/default/*.hap; do
            [ -e "$f" ] || continue
            cp "$f" release-assets/HarmonyWeather-unsigned.hap
            count=$((count + 1))
          done
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          ls -lh release-assets

      - name: 发布
        if: steps.assets.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/*.hap
          body: |
            ## HarmonyWeather ${{ steps.meta.outputs.tag }}

            由 GitHub Actions 现场编译（HarmonyOS Command Line Tools 26.0.0），不是仓库里的快照。

            附件是**未签名**的 HAP，安装前请自行签名：

            - DevEco Studio：File → Project Structure → Signing Configs → 勾选 Automatically generate signature
            - 命令行：用 `hap-sign-tool` 配自己的 p12 / cer / p7b

            安装：

            ```bash
            hdc install HarmonyWeather-unsigned.hap
            ```
